<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPT Smart Parking CV Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar / Stats Panel -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <i class="fa-solid fa-motorcycle brand-icon"></i>
                <div>
                    <h1>Smart Parking</h1>
                    <span class="subtitle">FPT University CV Project</span>
                </div>
            </div>

            <div class="controls">
                <button id="btn-start" class="btn btn-primary"><i class="fa-solid fa-play"></i> Start Stream</button>
                <button id="btn-stop" class="btn btn-danger" disabled><i class="fa-solid fa-stop"></i> Stop</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-motorcycle"></i></div>
                    <div class="stat-details">
                        <h3>Motorcycles</h3>
                        <p class="stat-value" id="stat-motorcycles">0</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                    <div class="stat-details">
                        <h3>Persons</h3>
                        <p class="stat-value" id="stat-persons">0</p>
                    </div>
                </div>

                <div class="stat-card highlight-card">
                    <div class="stat-icon"><i class="fa-solid fa-square-parking"></i></div>
                    <div class="stat-details">
                        <h3>Available Gaps</h3>
                        <p class="stat-value" id="stat-gaps">0</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-gauge-high"></i></div>
                    <div class="stat-details">
                        <h3>System FPS</h3>
                        <p class="stat-value" id="stat-fps">0.0</p>
                    </div>
                </div>
            </div>

            <div class="status-indicator">
                <div class="led" id="system-led"></div>
                <span id="system-status-text">System Idle</span>
            </div>
        </aside>

        <!-- Main Video Area -->
        <main class="video-container">
            <div class="video-wrapper glass-panel">
                <div class="video-header">
                    <h2>Live Camera Feed</h2>
                    <div class="badges">
                        <span class="badge badge-ai"><i class="fa-solid fa-brain"></i> YOLOv8m</span>
                        <span class="badge badge-live"><i class="fa-solid fa-satellite-dish"></i> LIVE</span>
                    </div>
                </div>
                <div class="video-frame-container">
                    <img id="video-stream" src="" alt="Live Video Stream will appear here" class="hidden">
                    <div id="video-placeholder" class="placeholder">
                        <i class="fa-solid fa-video-slash"></i>
                        <p>Stream is offline. Press Start to connect.</p>
                    </div>
                </div>
            </div>
            
            <!-- Real-time Chart Area -->
            <div class="chart-wrapper glass-panel">
                <canvas id="realtimeChart"></canvas>
            </div>
        </main>
    </div>

    <!-- Main Logic -->
    <script src="js/app.js"></script>
</body>
</html>
